[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-metagenomics-pipeline"
version = "0.1.0"
description = "Pipeline bioinformatique pour l'analyse AMR et métagénomique"
authors = [{ name = "Ouléye SIDIBE" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]